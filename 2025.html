      /* Base styles */
      html {
        scroll-behavior: smooth;
        overflow-y: scroll;

      }

      ::-webkit-scrollbar {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 4px;
        background-color: rgba(0, 0, 0, .5);
        -webkit-box-shadow: 0 0 1px rgba(255, 255, 255, .5);
      }

      body {
        font-family: Montserrat, helvetica, arial, sans-serif;
        font-size: 16px;
        color: #0A3161;
        background-color: #B31942;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      h2 {
        font-weight: 700;
        font-size: 1.6em;
        margin-top: 30px;
      }

      p {
        line-height: 1.6em;
      }

      .container {
        max-width: 850px;
        margin: 20px auto 20px auto;
        padding-left: 15px;
        padding-right: 15px;
      }

      /* Common styles for header elements */
      #header, #question, #progress, #seperator, #answer {
        padding: 10px 0;
        font-size: 2.2em;
        color: #FFFFFF;
      }

      /* Header styles */
      #header {
        background-color: #0A3161;
      }

      /* Question styles */
      #question {
        background-color: #B31942;
        min-height: 100px;
      }

      /* Progress and Seperator styles */
      #progress, #seperator {
        background-color: #FFFFFF;
        color: #0A3161;
      }

      /* Answer styles */
      #answer {
        background-color: #0A3161;
        min-height: 100px;
      }

      /* Styles for the modal background */
      .modal-background {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .modal-background.show {
        display: flex;
      }

      /* Styles for the modal container */
      .modal-container {
        background-color: white;
        padding: 40px;
        border-radius: 5px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        max-width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }

      /* Media Queries for responsiveness */
      /* iPad and smaller devices */
      @media (max-width: 1024px) {
        .modal-container {
          max-width: 80%;
          padding: 30px;
        }
      }

      /* iPhone and smaller devices */
      @media (max-width: 768px) {
        .modal-container {
          max-width: 90%;
          padding: 20px;
        }
        
        #header, #question, #progress, #seperator, #answer {
          font-size: 1.4em;
        }
      }

      /* Desktop and larger devices */
      @media (min-width: 1200px) {
        .modal-container {
          max-width: 50%;
          padding: 100px;
        }
      }

      /* Styles for the input and button */
      .input-field {
        margin-bottom: 10px;
      }

      .input-field label {
        display: block;
        font-weight: bold;
        font-size: 1.2em;
        margin-bottom: 10px;
      }

      .input-field input[type="text"] {
        width: 100%;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 3px;
        margin-bottom: 10px;
        font-size: 16px;
        box-sizing: border-box;
      }

      .input-field button {
        padding: 15px 30px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        touch-action: manipulation;
      }

      .input-field button:active {
        background-color: #0056b3;
      }

      /* Media Queries for responsiveness */
      /* iPad and smaller devices */
      @media (max-width: 1024px) {
        h2 {
          font-size: 1.4em;
        }

        .container {
          max-width: 100%;
        }
      }

      /* iPhone and smaller devices */
      @media (max-width: 768px) {
        h2 {
          font-size: 1.2em;
        }

        .container {
          max-width: 100%;
        }
      }

    </style>

  const stateCodes = [
    "AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA",
    "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD",
    "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ",
    "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC",
    "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"
  ];

  const modalBackground = document.getElementById("modalBackground");
  const stateCodeInput = document.getElementById("stateCodeInput");
  const submitButton = document.getElementById("submitButton");
  
  let i = 0;
  let isModalOpen = false;

  function showModal() {
    modalBackground.classList.add("show");
    isModalOpen = true;
    // Focus on input after a brief delay to ensure modal is visible
    setTimeout(() => {
      stateCodeInput.focus();
    }, 100);
  }

  function hideModal() {
    modalBackground.classList.remove("show");
    isModalOpen = false;
    window.scrollTo(0, 0);
  }

  function getStateCode() {
    const stateCode = stateCodeInput.value.trim().toUpperCase();
    
    if (stateCode && stateCodes.includes(stateCode)) {
      localStorage.setItem("current-state", stateCode);
      hideModal();
      // Start the quiz
      advance();
    } else {
      alert("Please enter a valid state code (e.g., CA, NY, TX)");
      stateCodeInput.focus();
    }
  }

  function advance() {
    const state = localStorage.getItem("current-state");
    
    // Check if we need to show modal
    if (!state || !stateCodes.includes(state)) {
      showModal();
      return;
    }

    // Toggle between question and answer
    if (i % 2 === 0) {
      // Show question
      document.getElementById('question-text').innerHTML = questions[Math.floor(i/2)]["Question"];
      document.getElementById('answer-text').innerHTML = " ";
      document.getElementById('progress-text').innerHTML = (Math.floor(i/2) + 1) + "/128";
      console.log(`haha    ` + (Math.floor(i/2) + 1) + "/128");
    } else {
      // Show answer
      let answers = "<ul>";
      const currentQuestion = questions[Math.floor(i/2)];
      
      if (currentQuestion["Regional"]) {
        const regionalAnswers = currentQuestion[state];
        if (regionalAnswers && regionalAnswers.length > 0) {
          for (const answer of regionalAnswers) {
            answers += "<li>" + answer + "</li>";
          }
        } else {
          answers += "<li>No regional data available for your state</li>";
        }
      } else {
        for (const answer of currentQuestion["Answers"]) {
          answers += "<li>" + answer + "</li>";
        }
      }
      answers += "</ul>";
      
      document.getElementById('answer-text').innerHTML = answers;
      
      // Scroll to answer smoothly
      setTimeout(() => {
        document.getElementById('answer').scrollIntoView({ behavior: 'smooth' });
      }, 50);
    }

    i += 1;
    console.log(`haha    i= ` + i);

    // Reset after all questions (total questions *2)
    if (i >= 256 ) {
      i = 0;
    }
  }

  // Submit button click handler
  submitButton.addEventListener('click', getStateCode);

  // Enter key in input field
  stateCodeInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      getStateCode();
    }
  });

  // Keyboard advance (desktop)
  document.addEventListener('keypress', function(e) {
    if (!isModalOpen) {
      advance();
    }
  });

  // Touch/click advance
  document.addEventListener('pointerdown', function(e) {
    // Don't advance if clicking on modal or its contents
    if (!isModalOpen && !modalBackground.contains(e.target)) {
      advance();
    }
  });

  // Check state on page load
  window.addEventListener('load', function() {
    const state = localStorage.getItem("current-state");
    if (!state || !stateCodes.includes(state)) {
      showModal();
    }
  });

  </script>
